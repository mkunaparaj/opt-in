<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>
</head>
<body>
  <div class="container">
    <h1>Create Your Account</h1>
    <form id="signupForm">
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="consentCheckbox" checked disabled>
          <span>I agree to receive automated recurring text messages and promotional offers.</span>
        </label>
      </div>

      <div class="buttons">
        <button type="submit" id="confirmBtn">CREATE ACCOUNT</button>
      </div>
    </form>
  </div>
</body>
</html>
